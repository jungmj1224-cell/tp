<html lang="ko">

<title>서원 & 세운 Observation Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --c1: #4a5568;
    --c2: #f6ad55;
    --ink: #1c1a17;
    --paper: #efece4;
    --rule: #c9c4b6;
    --mono: 'IBM Plex Mono', monospace;
    --serif: 'Noto Serif KR', serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    font-family: var(--serif);
    color: var(--ink);
  }
  body {
    display: flex; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .cc2-scroll::-webkit-scrollbar { width: 0; }
  .cc2-row { transition: background-color .15s; cursor: pointer; }
  .cc2-row:hover { background-color: rgba(0,0,0,0.035); }

  .cc2-frame {
    width: 390px; height: 720px; max-width: 100%;
    position: relative; overflow: hidden;
    background: var(--paper);
    border: 1px solid var(--ink);
    box-shadow: 10px 10px 0 rgba(28,26,23,0.14);
  }
  .cc2-page {
    position: absolute; inset: 0;
    background: var(--paper);
    display: flex; flex-direction: column;
    opacity: 0; visibility: hidden;
    transition: opacity .22s ease;
  }
  .cc2-page.active { opacity: 1; visibility: visible; }

  .cc2-home-body {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; padding: 0 34px;
  }
  .cc2-eyebrow {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; color: #7d7768;
  }
  .cc2-hr { height: 1px; background: var(--ink); margin: 12px 0 26px; }
  .cc2-names {
    display: flex; align-items: baseline; gap: 10px;
    font-size: 30px; font-weight: 700; line-height: 1.25;
  }
  .cc2-names .n1 { color: var(--c1); }
  .cc2-names .heart { font-size: 17px; color: var(--c2); opacity: 0.8; }
  .cc2-names .n2 { color: var(--c2); }
  .cc2-cta {
    margin-top: 46px; padding: 15px 0;
    border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.18em;
    cursor: pointer; width: 100%;
  }

  .cc2-listhead { flex: none; padding: 18px 20px 0; background: var(--paper); }
  .cc2-listhead-top { display: flex; align-items: center; gap: 12px; }
  .cc2-back {
    background: none; border: none; cursor: pointer;
    font-family: var(--mono); font-size: 15px; color: var(--ink); padding: 0;
  }
  .cc2-listhead-title { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; color: #7d7768; }
  .cc2-listhead-cols {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 0 8px; border-bottom: 1px solid var(--ink);
  }
  .cc2-col-label { flex: 1; font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em; color: #7d7768; }
  .cc2-col-name { width: 34px; text-align: center; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em; }
  .cc2-col-name.n1 { color: var(--c1); }
  .cc2-col-name.n2 { color: var(--c2); }

  .cc2-list { list-style: none; margin: 0; padding: 0 20px 28px; overflow-y: auto; flex: 1; min-height: 0; }
  .cc2-item { border-bottom: 1px solid var(--rule); }
  .cc2-row { display: flex; align-items: center; gap: 8px; padding: 13px 0; }
  .cc2-idx { font-family: var(--mono); font-size: 9.5px; color: #a29b8a; flex: none; width: 20px; }
  .cc2-text { flex: 1; font-size: 13px; line-height: 1.45; }
  .cc2-markwrap { width: 34px; display: flex; justify-content: center; }
  .cc2-mark { width: 15px; height: 15px; flex: none; border: 1.2px solid var(--rule); background: transparent; display: block; }
  .cc2-mark.on.c1 { border-color: var(--c1); background: var(--c1); }
  .cc2-mark.on.c2 { border-color: var(--c2); background: var(--c2); }

  .cc2-detail { padding: 0 0 14px 10px; display: none; flex-direction: column; gap: 9px; }
  .cc2-detail.open { display: flex; }
  .cc2-detail-block { border-left: 2px solid; padding-left: 10px; }
  .cc2-detail-block.c1 { border-color: var(--c1); }
  .cc2-detail-block.c2 { border-color: var(--c2); }
  .cc2-detail-name { font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; }
  .cc2-detail-name.c1 { color: var(--c1); }
  .cc2-detail-name.c2 { color: var(--c2); }
  .cc2-detail-text { font-size: 12px; line-height: 1.6; color: #4a463d; margin-top: 2px; }
</style>
</head>

<script>
(function () {
  var CHAR1_NAME = "서원";

  document.querySelectorAll('[data-goto]').forEach(function (btn) {

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
