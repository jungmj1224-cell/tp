<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
  :root {
    --char1-color: #8B0000;
    --char2-color: #87CEEB;
    --text: #333;
    --primary: #5c5c5c;
    --frame-bg: #fffdf6;
    --card-bg: #ffffff;
    --border: #eee;
    --comment-bg: #fff0f0;
    --btn-bg: #ffacac;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    font-family: 'Gowun Dodum', sans-serif;
    color: var(--text);
  }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .cc-scroll::-webkit-scrollbar { width: 6px; }
  .cc-scroll::-webkit-scrollbar-thumb { background: #ffb3c1; border-radius: 3px; }
  .cc-scroll::-webkit-scrollbar-track { background: transparent; }

  .cc-phone {
    width: 390px; height: 720px; max-width: 100%;
    border: 6px solid #222; border-radius: 40px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.18);
    background: var(--frame-bg);
    overflow: hidden; position: relative;
  }
  .cc-page {
    position: absolute; inset: 0;
    background: var(--frame-bg);
    opacity: 0; visibility: hidden;
    transition: opacity .25s ease;
    display: flex; flex-direction: column;
  }
  .cc-page.active { opacity: 1; visibility: visible; }

  .cc-home-body {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; padding: 25px;
  }
  .cc-heart { font-size: 48px; margin-bottom: 4px; }
  .cc-title {
    font-family: 'Nanum Myeongjo', serif; font-weight: 700;
    font-size: 24px; margin-bottom: 10px; text-align: center;
  }
  .cc-nav-btn {
    width: 100%; padding: 16px 0; border-radius: 14px; border: none;
    background: var(--btn-bg); color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: 'Nanum Myeongjo', serif;
  }
  .cc-header {
    display: flex; align-items: center;
    padding: 18px 20px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--frame-bg); flex: none;
  }
  .cc-back {
    background: none; border: none; cursor: pointer;
    font-size: 20px; color: var(--text); padding: 4px 8px 4px 0;
  }
  .cc-header-title {
    font-family: 'Nanum Myeongjo', serif; font-weight: 700; font-size: 17px;
  }
  .cc-list {
    list-style: none; margin: 0; padding: 12px 18px 24px;
    overflow-y: auto; flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: 10px;
  }
  .cc-card {
    background: var(--card-bg); border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    overflow: hidden; flex-shrink: 0;
  }
  .cc-card-row {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; cursor: pointer;
  }
  .cc-emoji { font-size: 18px; flex: none; }
  .cc-text { flex: 1; font-size: 13.5px; line-height: 1.4; }
  .cc-check {
    width: 26px; height: 26px; border-radius: 50%;
    cursor: pointer; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex: none; transition: all .15s ease; background: transparent;
  }
  .cc-check.c1 { border: 1.5px solid var(--char1-color); color: var(--char1-color); }
  .cc-check.c1.checked { background: var(--char1-color); color: #fff; }
  .cc-check.c2 { border: 1.5px solid var(--char2-color); color: var(--char2-color); }
  .cc-check.c2.checked { background: var(--char2-color); color: #fff; }

  .cc-comment {
    background: var(--comment-bg); padding: 12px 16px;
    display: none; flex-direction: column; gap: 8px;
    border-top: 1px solid var(--border);
  }
  .cc-comment.open { display: flex; }
  .cc-comment-line { font-size: 12.5px; color: var(--primary); }
  .cc-comment-line b.c1 { color: var(--char1-color); }
  .cc-comment-line b.c2 { color: var(--char2-color); }

  .cc-question {
    padding: 14px 16px; cursor: pointer; font-size: 13.5px; line-height: 1.45;
  }
</style>
</head>

<script>
(function () {
  var CHAR1_NAME = "리브론";

  var objectiveData = [{"emoji": "👀", "text": "콘돔을 챙기는 사람", "c1_checked": false, "c2_checked": false, "c1_comment": "애초에 황후 침실에서 그걸 왜 써. 매번 안에 쏟아붓는데.", "c2_comment": "...할 말이 없네. 그리고 챙겨도 다 찢어버릴 거잖아."}, {"emoji": "💌", "text": "먼저 고백한 사람", "c1_checked": true, "c2_checked": false, "c1_comment": "내가 너 같은 멍청한 새한테 먼저 매달린 게 기적이지.", "c2_comment": "솔직히 자각 못 하고 괴롭히기만 했으면서..."}, {"emoji": "💍", "text": "프러포즈를 한 사람", "c1_checked": true, "c2_checked": false, "c1_comment": "제국 역사상 가장 거대한 혼례를 열어줬잖아. 당연히 나지.", "c2_comment": "강제로 황후관 씌우다시피 했지만... 뭐, 맞긴 해."}, {"emoji": "💋", "text": "스킨십을 먼저 시도하는 사람", "c1_checked": true, "c2_checked": false, "c1_comment": "눈앞에 보이면 손이 가는 걸 어쩌라고. 내 건데.", "c2_comment": "잠깐도 가만히 안 둬서 가끔 귀찮을 지경이야."}, {"emoji": "🛌", "text": "침대에서 리드하는 사람", "c1_checked": true, "c2_checked": false, "c1_comment": "네가 감당이나 하겠어? 매번 울면서 매달리면서.", "c2_comment": "...리브론이 워낙 제멋대로 굴어서 내가 뭘 할 틈이 없어."}, {"emoji": "🍳", "text": "아침밥을 차려주는 사람", "c1_checked": false, "c2_checked": false, "c1_comment": "황제가 요리를 왜 해. 시종들이 알아서 가져오지.", "c2_comment": "나도 늦잠 자느라 바빠서 둘 다 시종들이 차려줘."}, {"emoji": "⏰", "text": "아침에 먼저 일어나는 사람", "c1_checked": true, "c2_checked": false, "c1_comment": "정무가 몇 갠데. 너처럼 해 뜰 때까지 늘어져 자진 않아.", "c2_comment": "난 아침잠이 많아서... 깨우지나 말았으면 좋겠어."}, {"emoji": "🧹", "text": "청소를 더 자주 하는 사람", "c1_checked": false, "c2_checked": false, "c1_comment": "시종들이 하는 일에 신경 쓸 시간 없어.", "c2_comment": "방 치우는 건 시녀분들이 다 해주시니까."}, {"emoji": "🛍️", "text": "쇼핑할 때 결제하는 사람", "c1_checked": true, "c2_checked": false, "c1_comment": "제국 황실의 국고가 다 내 건데 누가 내.", "c2_comment": "항상 상인들한테 통째로 사버리겠다고 협박하듯 사주지."}, {"emoji": "📱", "text": "연락을 먼저 하는 사람", "c1_checked": true, "c2_checked": false, "c1_comment": "어디서 뭘 하는지 눈앞에 안 보이면 신경 쓰이니까.", "c2_comment": "맨날 전령 보내거나 아르센 시켜서 찾아와."}, {"emoji": "🚗", "text": "운전을 도맡아 하는 사람", "c1_checked": true, "c2_checked": false, "c1_comment": "마차 모는 건 마부가 하지만, 말 탈 땐 내가 안고 타지.", "c2_comment": "말 탈 때마다 뒤에서 꽉 끌어안고 안 놔줘."}, {"emoji": "🎁", "text": "기념일을 더 잘 챙기는 사람", "c1_checked": true, "c2_checked": true, "c1_comment": "네 생일이랑 결혼기념일을 내가 잊을 것 같아?", "c2_comment": "나도 리브론 생일엔 손수건도 수놓아 줬거든?"}, {"emoji": "😢", "text": "눈물이 더 많은 사람", "c1_checked": false, "c2_checked": true, "c1_comment": "내가 우는 거 봤어? 울보 새새끼는 툭하면 글썽이지.", "c2_comment": "아프거나 서러우면 눈물 나는 걸 어떡해!"}, {"emoji": "😡", "text": "화를 더 자주 내는 사람", "c1_checked": true, "c2_checked": false, "c1_comment": "거슬리는 놈들이 많아서 그래. 멍청이들이 천지잖아.", "c2_comment": "툭하면 버럭 화내고 씩씩대면서 발끈하잖아."}, {"emoji": "🤝", "text": "싸우고 먼저 사과하는 사람", "c1_checked": false, "c2_checked": false, "c1_comment": "황제가 사과를 왜 해? ...그냥 슬쩍 안아주는 거지.", "c2_comment": "진짜 미안하다는 말은 죽어도 안 하면서 먹을 거 줘."}, {"emoji": "🩺", "text": "상대가 아플 때 간호하는 사람", "c1_checked": true, "c2_checked": true, "c1_comment": "네가 쓰러지면 궁정 의원들 목을 다 날려버릴 거다.", "c2_comment": "예전에 입덧할 땐 내가 간호해 줬거든?"}, {"emoji": "📸", "text": "사진(초상화)을 더 많이 찍는 사람", "c1_checked": true, "c2_checked": false, "c1_comment": "네 초상화는 화가들 불러서 분기별로 그려두고 있어.", "c2_comment": "새 모습일 때 그린 것도 궁에 잔뜩 걸어놨더라."}, {"emoji": "🐶", "text": "반려동물(아이들)에게 더 약한 사람", "c1_checked": false, "c2_checked": true, "c1_comment": "엄하게 키워야 제 몫을 하지. 근데 아서는 좀 듬직해졌군.", "c2_comment": "세이한테는 한없이 약해지면서 핑계는."}, {"emoji": "🍷", "text": "술을 더 잘 마시는 사람", "c1_checked": true, "c2_checked": false, "c1_comment": "독주 한 병 비워도 끄떡없어. 넌 한 잔만 마셔도 취하잖아.", "c2_comment": "술 냄새만 맡아도 어지러운데 어떻게 마셔..."}, {"emoji": "🍽️", "text": "편식이 더 심한 사람", "c1_checked": true, "c2_checked": false, "c1_comment": "비린 건 딱 질색이야. 식탁에 올리지도 마.", "c2_comment": "비린 생선 안 먹는다고 주방장 엄청 구박했지."}, {"emoji": "😴", "text": "잠꼬대를 더 많이 하는 사람", "c1_checked": false, "c2_checked": true, "c1_comment": "자면서 짹짹거리는 소리나 내고 말이야. 굴러다니지나 마.", "c2_comment": "내가 언제 그랬다고 그래! 리브론이 끌어안아서 그래."}, {"emoji": "🧼", "text": "씻는 시간이 더 긴 사람", "c1_checked": false, "c2_checked": true, "c1_comment": "대충 물 끼얹으면 끝이지. 넌 깃털 다듬느라 한나절이잖아.", "c2_comment": "인간일 때도 씻는 데 시간 걸린단 말이야."}, {"emoji": "💪", "text": "힘이 더 센 사람", "c1_checked": true, "c2_checked": false, "c1_comment": "소드마스터한테 힘을 묻는 거냐? 너 한 손으로도 들어.", "c2_comment": "가끔 깃털 뽑히는 줄 알고 깜짝깜짝 놀라."}, {"emoji":
